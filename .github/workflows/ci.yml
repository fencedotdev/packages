name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Phase 0 checklist 0.3.1-0.3.4: the four steps every one of the 10 repos runs,
# regardless of whether it's a deployable service, a library, or a Next.js app.
#
# NOT included here yet: Docker build/publish (0.3.5-0.3.7, deployable/library
# repos only) and the migration dry-run (0.3.8, identity-kyb only) — those need
# a real Dockerfile/schema to exist first and get added per-repo once that repo
# has application code, not at template-creation time.
#
# Runs on GitHub-hosted ubuntu-latest — permanently, not as an unfinished
# migration (fence-build-order.md v1.24, 2026-08-08). This repo (then
# `contracts`, renamed `packages` 2026-08-21) is the only public repository
# in the org; the shared self-hosted Hetzner pool (0.3.10) is also used by
# the KMS-signing-key and DB-credential-holding repos (identity-kyb/
# issuance/verification), so putting this repo's CI on it would reopen the
# exact blast-radius risk 0.3.10's dedicated-pool decision exists to
# prevent. Do not switch `runs-on` to `[self-hosted, fence-runner]` here.
jobs:
  ci: # zizmor: ignore[excessive-permissions] no permissions: block on this job, not a regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Step 1 (0.3.2): fail on any high/critical vulnerability, before any build step.
      - name: npm audit
        run: npm audit --audit-level=high

      # New, v1.7 (0.3.2a): Semgrep SAST — named in the stack (App. G) but previously
      # never actually wired into CI. semgrep/semgrep-action itself has been
      # archived/deprecated upstream since 2024-04-09 (checklist 1.11.18/1.11.20)
      # — migrated to the plain CLI. A plain step here, not a separate job —
      # unlike the self-hosted-pool repos, this job already runs on
      # ubuntu-latest, so the glibc mismatch that forced a separate job
      # elsewhere (semgrep's Linux wheels require manylinux_2_34, confirmed
      # against the real self-hosted runner) doesn't apply here — same
      # reasoning as the zizmor step below.
      #
      # Unauthenticated (no Semgrep AppSec Platform account/SEMGREP_APP_TOKEN
      # in this workspace): `semgrep scan --config p/default --error` is the
      # documented Community Edition path
      # (docs.semgrep.dev/semgrep-ci/sample-ci-configs), deliberately NOT
      # `--config auto`, which has a confirmed "requires login" bug on recent
      # CLI versions (semgrep/semgrep#10734) that `p/default` (a fixed named
      # ruleset, not the login-gated auto-detection feature) sidesteps
      # entirely. `--error` is required for findings to actually fail the
      # build — confirmed directly: `semgrep scan --config p/default` alone
      # exits 0 even with findings.
      #
      # Pinned via .github/semgrep/requirements.txt, not a Docker image
      # digest — confirmed Dependabot's github-actions ecosystem does not
      # track image references inside a job's `container:` key or a step's
      # `uses: docker://...` (dependabot-core#5819, still open), so a Docker
      # pin here would go stale silently, unlike every other pin in this
      # file. A `pip`-ecosystem dependabot.yml entry keeps this one
      # genuinely auto-updated the same way.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Semgrep
        run: |
          pip install --quiet -r .github/semgrep/requirements.txt
          semgrep scan --config p/default --error

      # Added 2026-08-12 after Aikido flagged unpinned actions and GitHub
      # Actions script injection (both fixed everywhere) — zizmor is a
      # purpose-built static analyzer for GitHub Actions workflows that
      # catches both classes automatically, plus several others. A plain
      # step here, not a separate job — unlike the self-hosted-pool repos,
      # this job already runs on ubuntu-latest, so neither the
      # Docker-in-Docker mount issue nor the glibc mismatch that forced a
      # separate job elsewhere applies here. advanced-security: false
      # avoids needing security-events: write; collect: workflows scopes
      # this to .github/workflows/ specifically (the default also picks up
      # dependabot.yml, untriaged and out of scope for what this catches).
      # zizmor.yml (repo root) suppresses the specific, already-triaged
      # findings that predate this step.
      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          collect: workflows
          advanced-security: "false"
          annotations: "true"

      # Build every package first — added 2026-08-21 when
      # credential-verification's typecheck failed on a genuinely clean
      # checkout (reproduced locally via `npm ci` into a fresh clone; a
      # locally-built workspace masked it, since a stale dist/ from an
      # earlier build satisfied module resolution). A package that
      # depends on another workspace package (credential-verification on
      # contracts) resolves its types via the dependency's own
      # package.json "types" field, i.e. its built dist/index.d.ts — not
      # TS project references or source paths — so that dependency must
      # already be built before typecheck can resolve it. This will bite
      # any future package with an intra-monorepo dependency the same
      # way, not just this one pair.
      - name: Build
        run: npm run build

      # Step 2 (0.3.3): fail on any type error. Delegates to each package's
      # own typecheck script (npm workspaces) — this repo restructured
      # 2026-08-21 from a single package at the repo root into
      # packages/*/, so there's no longer one root tsconfig to point
      # `tsc` at directly.
      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Mechanized backstops for automatic-code-review/rules.md's Rules 3
      # (banned folder names) and 4 (no payment-shaped fields) — both are
      # literal/keyword matches, not judgment calls, so they run here rather
      # than costing a (Haiku-model) automatic-code-reviewer call on every
      # session. Payment-fields needs a base ref to diff against; on a PR
      # that's the PR's base commit (fetched shallowly, since checkout
      # defaults to a single-commit clone), on a direct push to main it's the
      # previous commit.
      - name: Banned folder names
        run: npm run check:banned-folders

      - name: Payment-field check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            npm run check:payment-fields -- "${{ github.event.pull_request.base.sha }}"
          else
            npm run check:payment-fields -- "HEAD~1"
          fi

      # Step 3 (0.3.4): covers every package's tests in one vitest run —
      # root vitest.config.ts globs packages/*/src/**/*.test.ts.
      - name: Test
        run: npm test -- --coverage

  # Regression coverage for .claude/hooks/tools/*.sh — added alongside the
  # pre-implementation-gate/enforced-pipeline tooling (prd-gate, complete-task,
  # run-task) specifically because this class of hook has already shipped one
  # real, silent bug in production (block-dangerous-commands.sh's BSD-grep
  # flag-parsing bug — see that hook's own header comment). Pure bash, no
  # npm ci/build dependency, so ubuntu-latest rather than the self-hosted pool
  # — this repo runs everything on ubuntu-latest anyway (see header comment).
  hooks-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hook tests
        run: bash .claude/hooks/tests/run-hook-tests.sh

  # 0.3.7 — CI step 5-alt (library repos, merge-to-main only): publish the
  # package with a version bump, gated on 0.5.6's consumer-driven contract
  # test suite passing against every consuming repo first — a breaking
  # schema change must fail here, not surface as a runtime error in
  # `verification` three repos away. Split into three jobs so the gate is a
  # real dependency the publish job can't bypass, not just a step ordering
  # convention within one job.
  #
  # This whole pipeline still names contracts specifically (packages/
  # contracts/, @fence.dev/contracts) rather than generically looping over
  # packages/* — this repo restructured into an npm-workspaces monorepo
  # 2026-08-21, but contracts is still the only package with a real
  # consumer-verification gate to preserve. A second public package
  # (credential-verification) that doesn't have consumer contract tests
  # yet uses a simpler, ungated publish path — see that package's own
  # notes when it's added.
  #
  # Publishes to the PUBLIC npm registry (registry.npmjs.org), not GitHub
  # Packages — a deliberate choice, decided 2026-07-31 after direct research
  # ruled out the alternatives: npm's own --provenance flag needs a public
  # source repo (contracts now is: made public the same day, confirmed clean
  # history first — no secrets, template scaffolding and this session's
  # schema code only); GitHub's native artifact attestations need GitHub
  # Enterprise Cloud for a private repo (fencedotdev is on Team) — moot now
  # the repo is public, but GitHub Packages' npm registry doesn't document
  # or appear to support provenance regardless of visibility (npm's own
  # tooling expects registry-url: registry.npmjs.org specifically). Uses
  # npm's Trusted Publisher / OIDC flow (GA since mid-2025) — no NPM_TOKEN
  # stored anywhere; npm exchanges this workflow's GitHub Actions OIDC token
  # for a short-lived publish credential at publish time, and generates a
  # provenance attestation automatically as part of that flow. One-time
  # manual bootstrap was required outside CI (npm's Trusted Publisher config
  # is set from an already-existing package's own settings page — v0.1.0
  # itself was published manually to establish the package before Trusted
  # Publishing could be configured for v0.1.1 onward); see
  # fence-checklist-phase-0.md 0.3.7 for that trail.
  build-and-pack: # zizmor: ignore[excessive-permissions] no permissions: block on this job, not a regression
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      already_published: ${{ steps.check.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # A push to main without a version bump (e.g. a docs-only or handover
      # change merged alongside a schema PR) is a no-op here, not a failure
      # — publish only happens when package.json's version isn't on the
      # registry yet. Public registry, no auth needed just to check.
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./packages/contracts/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@fence.dev/contracts@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@fence.dev/contracts@$VERSION is already published — nothing to do"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.already_published == 'false'
        run: npm run build --workspace=packages/contracts

      - name: Pack
        if: steps.check.outputs.already_published == 'false'
        run: npm pack --workspace=packages/contracts --pack-destination .

      - name: Upload the packed tarball for the consumer-gate and publish jobs
        if: steps.check.outputs.already_published == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contracts-tarball
          path: fence.dev-contracts-*.tgz
          retention-days: 1

  # 0.5.6's gate, run for real: installs the *newly built, not-yet-published*
  # tarball into each consuming repo's own checkout and runs that repo's own
  # consumer contract test against it. fail-fast: false so all seven report
  # independently rather than the first failure hiding the rest.
  #
  # Bootstrap note: none of the seven repos have their 0.5.6 consumer test
  # merged to main yet as of this workflow's first version (those branches
  # are held back pending this exact publish, see fence-checklist-phase-0.md
  # 0.5.6/0.5.7) — each leg below checks for the test file's existence and
  # skips cleanly (not a failure) if it isn't there yet. This gate starts
  # doing real verification automatically, with no further changes needed
  # here, the moment each repo's consumer-test PR merges.
  verify-consumers: # zizmor: ignore[excessive-permissions] no permissions: block on this job, not a regression
    needs: build-and-pack
    if: needs.build-and-pack.outputs.already_published == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - identity-kyb
          - issuance
          - verification
          - scope-policy
          - console
          - verifier-sdk
          - sandbox
    steps:
      - name: Download the packed tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: contracts-tarball

      - name: Checkout ${{ matrix.repo }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fencedotdev/${{ matrix.repo }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: consumer
          persist-credentials: false

      - name: Run ${{ matrix.repo }}'s consumer contract test against the new build
        working-directory: consumer
        run: |
          if [ ! -f src/__tests__/contracts.test.ts ]; then
            echo "::notice::${{ matrix.repo }} has no consumer contract test on main yet (0.5.6 not merged there) — nothing to verify"
            exit 0
          fi
          npm ci
          npm install --no-save "$GITHUB_WORKSPACE"/fence.dev-contracts-*.tgz
          npx vitest run src/__tests__/contracts.test.ts

  publish:
    needs: [build-and-pack, verify-consumers]
    if: needs.build-and-pack.outputs.already_published == 'false' && needs.verify-consumers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm's OIDC Trusted Publisher exchange + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm's OIDC Trusted Publisher exchange needs npm >= 11.5.1. Node 24's
      # bundled npm already clears that, but this step keeps the publish
      # job on npm's actual latest rather than whatever ships with the
      # pinned Node version. Bumped from Node 20 (2026-08-03): `npm@latest`
      # is a floating target, and it silently crossed a new engine
      # requirement (`^22.22.2 || ^24.15.0 || >=26.0.0`) that Node 20 no
      # longer satisfies — this step started failing on main with no
      # workflow change of our own, taking `npm publish` down with it
      # (three downstream steps skipped as a result). Node 24 clears the
      # new floor with margin; if `npm@latest` drifts past Node 24 again,
      # pinning to a specific compatible npm version (e.g. `npm@11`)
      # instead of chasing `@latest` would be more durable than repeating
      # this bump indefinitely.
      - name: Update npm
        # zizmor: ignore[adhoc-packages] deliberate — npm's OIDC Trusted
        # Publisher flow needs a recent npm, and the bundled Node version
        # has drifted behind npm's engine requirement before (see comment
        # above). A genuine, separately-worth-fixing gap (pin to a
        # specific npm major instead of chasing @latest), out of scope
        # for this restructuring PR.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=packages/contracts

      # No NPM_TOKEN: npm exchanges this job's GitHub Actions OIDC token for
      # a short-lived publish credential via the Trusted Publisher config on
      # npmjs.com (fence-checklist-phase-0.md 0.3.7), and generates the
      # provenance attestation automatically as part of the same flow.
      - name: Publish to npm
        run: npm publish --provenance --workspace=packages/contracts

  # credential-verification's own publish path, deliberately simpler than
  # contracts' three-job build-and-pack/verify-consumers/publish gate above
  # — this package has no consuming repo with a merged consumer contract
  # test yet (see this package's own README when that changes; at that
  # point this job should gain the same gate, not stay simple out of
  # inertia). Single job: check the version isn't already published, build,
  # publish — same OIDC Trusted Publisher mechanism as contracts, no
  # NPM_TOKEN.
  #
  # Bootstrap note, same as contracts' own history (0.3.7): npm's Trusted
  # Publisher can only be configured against a package version that
  # already exists on the registry, so v0.1.0 had to be published manually
  # (an authenticated human `npm publish`, with 2FA) before this job's
  # OIDC flow could take over for v0.1.1 onward.
  publish-credential-verification:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm's OIDC Trusted Publisher exchange + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # zizmor: ignore[adhoc-packages] deliberate — see the identical
        # step's comment in the `publish` job above.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./packages/credential-verification/package.json').version")
          if npm view "@fence.dev/credential-verification@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@fence.dev/credential-verification@$VERSION is already published — nothing to do"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # Builds every workspace, not just --workspace=packages/credential-
      # verification — this package's own tsc build needs contracts'
      # built dist/index.d.ts to resolve its "@fence.dev/contracts"
      # import (same reasoning as the `ci` job's own Build step above;
      # this job hit the identical failure on its first real merge-to-main
      # run, confirmed live, not just reasoned about).
      - name: Build
        if: steps.check.outputs.already_published == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --provenance --workspace=packages/credential-verification

  # agent-signing's own publish path — same simpler, ungated shape as
  # credential-verification's above (no consuming repo with a merged
  # consumer contract test yet; add the same three-job gate contracts uses
  # once one exists, don't leave it ungated out of inertia). No dependency
  # on @fence.dev/contracts, but built via the full workspace build anyway
  # for consistency with the pattern above.
  #
  # Bootstrap note, same as contracts'/credential-verification's own
  # history: npm's Trusted Publisher can only be configured against a
  # package version that already exists on the registry, so v0.1.0 must be
  # published manually (an authenticated human `npm publish`, with 2FA)
  # before this job's OIDC flow can take over for v0.1.1 onward. Not done
  # yet — see this package's own README.
  publish-agent-signing:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm's OIDC Trusted Publisher exchange + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # zizmor: ignore[adhoc-packages] deliberate — see the identical
        # step's comment in the `publish` job above.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./packages/agent-signing/package.json').version")
          if npm view "@fence.dev/agent-signing@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@fence.dev/agent-signing@$VERSION is already published — nothing to do"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.check.outputs.already_published == 'false'
        run: npm run build

      - name: Publish to npm
        if: steps.check.outputs.already_published == 'false'
        run: npm publish --provenance --workspace=packages/agent-signing
